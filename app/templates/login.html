<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRASH BANK - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="dark-mode"> <button id="theme-toggle" onclick="toggleTheme()"
        style="position: absolute; top: 20px; right: 20px;">
        🌓 Alternar Tema
    </button>

    <div class="login-container">
        <img src="{{ url_for('static', filename='img/crash.png') }}" alt="Logo CRASH BANK"
            style="max-width: 100%; border-radius: 8px; margin-bottom: 20px;">

        <h1>CRASH BANK</h1>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="flash-messages">
            {% for message in messages %}
            <p style="color: #ff4d4d; font-weight: bold; margin-bottom: 10px;">{{ message }}</p>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}

        <form action="/login_post" method="POST">
            <div class="input-group">
                <input type="text" name="identificador" placeholder="Digite seu CPF ou E-mail" required autofocus>
            </div>

            <div class="input-group">
                <input type="password" name="senha" placeholder="Sua senha" required>
            </div>

            <button type="submit" class="btn-primary"
                style="background-color: #00ff88; color: #000; font-weight: bold; margin-top: 20px;">
                ACESSAR CONTA
            </button>

            <button type="button" class="btn-secondary" onclick="window.location.href='/registrar'"
                style="margin-top: 10px; border: 1px solid #00ff88; color: var(--text-color); background: transparent;">
                CRIAR CONTA
            </button>
        </form>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
